  required:
    name: Required
    if: always()
    needs: [quality, test, minimum-dependencies, official-parity, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_DEPENDENCIES_RESULT: ${{ needs.minimum-dependencies.result }}
          PARITY_RESULT: ${{ needs.official-parity.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$TEST_RESULT" \
            "$MINIMUM_DEPENDENCIES_RESULT" \
            "$PARITY_RESULT" \
            "$PACKAGE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI dependency finished with status: $result" >&2
              exit 1
            fi
          done
