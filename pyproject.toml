[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-deepseek-v4"
version = "0.1.0"
description = "A compact, readable PyTorch reference implementation of the DeepSeek-V4 architecture (Flash and Pro)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nano-deepseek-v4 contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "safetensors>=0.4",
]

[project.scripts]
adaptive-v4-replay = "nano_deepseek_v4.memory_replay:main"

[project.optional-dependencies]
official = [
    "huggingface_hub>=0.20",
    "tokenizers>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
]
notebook = [
    "jupyter",
    "matplotlib",
    "ipywidgets",
]

[project.urls]
Homepage = "https://github.com/hebo1221/nano-deepseek-v4"
Repository = "https://github.com/hebo1221/nano-deepseek-v4"
Issues = "https://github.com/hebo1221/nano-deepseek-v4/issues"
Changelog = "https://github.com/hebo1221/nano-deepseek-v4/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["nano_deepseek_v4*"]
exclude = ["tests*", "notebooks*", "references*"]

[tool.setuptools.package-data]
nano_deepseek_v4 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "gpu: requires a CUDA-capable accelerator and is skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
