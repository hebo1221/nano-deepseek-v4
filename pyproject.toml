[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-deepseek-v4"
version = "0.2.0"
description = "A CPU-runnable PyTorch reference and conformance lab for DeepSeek-V4."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nano-deepseek-v4 contributors" }]
keywords = [
    "checkpoint-inspection",
    "checkpoint-verification",
    "conformance-testing",
    "deepseek-v4",
    "dspark",
    "mixture-of-experts",
    "pytorch",
    "reference-implementation",
    "sparse-attention",
    "transformer",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "safetensors>=0.6.1",
]

[project.scripts]
nano-deepseek-v4 = "nano_deepseek_v4.cli:main"
nano-deepseek-v4-aggregate = "nano_deepseek_v4.aggregate_comparisons:main"
nano-deepseek-v4-attention-reach = "nano_deepseek_v4.attention_reach:main"
nano-deepseek-v4-demo = "nano_deepseek_v4.demo:cli_main"
nano-deepseek-v4-generate = "nano_deepseek_v4.generate_text:main"
nano-deepseek-v4-compare = "nano_deepseek_v4.compare_bundles:main"
nano-deepseek-v4-inspect = "nano_deepseek_v4.architecture:main"
nano-deepseek-v4-parity = "nano_deepseek_v4.official_parity:main"
nano-deepseek-v4-train = "nano_deepseek_v4.train_text:main"
nano-deepseek-v4-verify-flash-0731 = "nano_deepseek_v4.verify_flash_0731_receipt:main"

[project.optional-dependencies]
official = [
    "huggingface_hub>=0.34.0",
    "packaging>=24.0",
]
parity = [
    "transformers==5.15.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "packaging>=24.0",
    "PyYAML>=6.0",
    "yamllint>=1.35",
    "build>=1.2",
    "twine>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]
notebook = [
    "jupyter",
]

[project.urls]
Homepage = "https://github.com/hebo1221/nano-deepseek-v4"
Documentation = "https://github.com/hebo1221/nano-deepseek-v4/blob/main/docs/README.md"
Repository = "https://github.com/hebo1221/nano-deepseek-v4"
Issues = "https://github.com/hebo1221/nano-deepseek-v4/issues"
Changelog = "https://github.com/hebo1221/nano-deepseek-v4/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2606.19348"

[tool.setuptools.packages.find]
include = ["nano_deepseek_v4*"]
exclude = ["tests*", "notebooks*", "references*"]

[tool.setuptools.package-data]
nano_deepseek_v4 = ["py.typed", "_receipts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "gpu: requires a CUDA-capable accelerator and is skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
